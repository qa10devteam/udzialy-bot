[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "udzialy-bot"
version = "0.1.0"
description = "Telegram bot for scraping Polish real estate portals for property share listings"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Developer"},
]
keywords = ["telegram", "bot", "real-estate", "scraping", "poland", "udzialy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "aiogram>=3.10",
    "aiosqlite>=0.19.0",
    "httpx[socks]>=0.27.0",
    "selectolax>=0.3.21",
    "curl_cffi>=0.7.0",
    "primp>=0.6.0",
    "nodriver>=0.35",
    "patchright>=1.43",
    "stem>=1.8.2",
    "PySocks>=1.7.1",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
udzialy-bot = "bot.main:main"

[tool.setuptools.packages.find]
include = ["bot*"]
