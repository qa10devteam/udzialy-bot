[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "udzialy-bot"
version = "3.0.2"
description = "Bot do wyszukiwania ogłoszeń sprzedaży udziałów w nieruchomościach"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "QA10 sp. z o.o.", email = "hello@qa10.io"},
]
keywords = ["telegram", "bot", "real-estate", "scraping", "poland", "udzialy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "aiogram>=3.10",
    "aiosqlite>=0.19.0",
    "httpx[socks,http2]>=0.27.0",
    "selectolax>=0.3.21",
    "curl_cffi>=0.7.0",
    "primp>=0.6.0",
    "nodriver>=0.35",
    "patchright>=1.43",
    "stem>=1.8.2",
    "PySocks>=1.7.1",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
udzialy = "udzialy_cli:main"

[project.gui-scripts]
udzialy-gui = "launcher:main"

[tool.setuptools.packages.find]
include = ["bot*", "scraper*", "detector*", "storage*", "geo*", "data*"]

[tool.setuptools]
py-modules = ["udzialy_cli", "launcher"]

[tool.setuptools.package-data]
"geo" = ["*.json"]
"data" = ["*.json"]
"*" = ["*.yaml"]
