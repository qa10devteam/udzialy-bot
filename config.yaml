# =============================================================================
# Udziały Bot — Configuration
# =============================================================================

telegram:
  token: "YOUR_BOT_TOKEN_HERE"
  owner_id: 0  # Your Telegram user ID

# Portal switches — enable/disable individual scrapers
portals:
  otodom:
    enabled: true
    base_url: "https://www.otodom.pl"
  olx:
    enabled: true
    base_url: "https://www.olx.pl"
  gratka:
    enabled: true
    base_url: "https://gratka.pl"
  morizon:
    enabled: true
    base_url: "https://www.morizon.pl"
  nieruchomosci_online:
    enabled: true
    base_url: "https://www.nieruchomosci-online.pl"
  domiporta:
    enabled: true
    base_url: "https://www.domiporta.pl"
  lento:
    enabled: true
    base_url: "https://www.lento.pl"
  gethome:
    enabled: true
    base_url: "https://gethome.pl"
  ogloszenia24:
    enabled: false
    base_url: "https://www.ogloszenia24.pl"

# Scraping settings
scraping:
  timeout: 30            # HTTP request timeout (seconds)
  max_concurrent: 3      # Max concurrent requests per portal
  retry_count: 2         # Retries on failure
  retry_delay: 5         # Delay between retries (seconds)
  delay_between: 2       # Delay between portal requests (seconds)
  user_agent_rotate: true

# Tor proxy settings
tor:
  enabled: true
  socks_port: 9050
  control_port: 9051
  control_password: "udzialy_tor_pass"
  circuit_rotate_interval: 300  # Rotate circuit every N seconds
  binary_path: "tor/tor.exe"    # Relative to project root

# Database
database:
  path: "data/udzialy.db"

# Logging
logging:
  level: "INFO"
  file: "data/bot.log"
